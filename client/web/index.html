<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ghostpad</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>ghostpad</h1>
  <div id="status" class="status" data-state="idle" role="status" aria-live="polite">
    <span class="dot"></span>
    <span id="status-text">Not connected</span>
    <span id="backend" class="backend"></span>
  </div>
</header>

<div id="banner-env" class="banner error" hidden></div>
<div id="banner-resume" class="banner warn" hidden></div>

<section id="connect">
  <form id="connect-form" action="#" method="get" autocomplete="off">
    <label>Host <input id="host" name="host" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="same host as this page"></label>
    <label>Token <input id="token" name="token" type="password" spellcheck="false" autocomplete="off" placeholder="optional"></label>
    <button id="connect-btn" type="submit">Connect</button>
    <button id="disconnect-btn" type="button">Disconnect</button>
  </form>
</section>

<section id="stats">
  <div><span class="k">Packets sent</span><span id="sent" class="v">0</span></div>
  <div><span class="k">Send rate</span><span id="rate" class="v">0</span><span class="u">/s</span></div>
  <div><span class="k">Pads</span><span id="padcount" class="v">0</span></div>
</section>

<section id="pads" aria-label="Connected controllers">
  <p id="nopads" class="hint">No controller detected. Press any button on the controller (browsers hide it until first input).</p>
</section>

<section id="latency" aria-label="Latency">
  <h2>Latency <small>(one-way = net RTT / 2; budget: median &le; 5 ms, p99 &le; 16.7 ms)</small></h2>
  <div id="lat-verdict" class="verdict"></div>
  <table id="lat-table"></table>
  <div id="lat-extras" class="extras"></div>
  <div class="lat-controls">
    <label class="inline">Polling
      <select id="poll-mode"><option value="raf">raf (display rate)</option><option value="fast">fast (~4 ms timer)</option></select>
    </label>
    <button id="lat-reset" type="button" class="secondary">Reset</button>
    <button id="lat-copy" type="button">Copy stats as JSON</button>
    <span id="lat-copy-msg" class="hint"></span>
  </div>
  <textarea id="lat-json" class="json" readonly hidden rows="8"></textarea>
</section>

<script type="module" src="main.js"></script>
</body>
</html>
